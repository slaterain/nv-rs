name: Preview packages (Linux, macOS)
# Builds the Linux and macOS preview packages (scripts/package-playtest.sh) and keeps them as this
# run's artifacts, for the maintainer to download, look at and publish BY HAND. Nothing here makes
# a release, a tag or anything public, and it never runs by itself: only by hand (Actions > this
# workflow > Run workflow, or `gh workflow run preview-packages.yml --ref BRANCH`).
#
# The runners are the oldest GitHub has for each system, so the programs start on as many
# systems as possible:
# - ubuntu-22.04: glibc 2.35 there; the program built 2026-11-16 needs glibc 2.34 or newer (BUILD.txt
#   says it, read from the program): Ubuntu 22.04, Debian 12, Fedora 35 and later.
# - macos-15: the oldest Apple silicon runner left (macos-14 is refused as "not supported" since
#   2026-11); the program is built for macOS 11 or newer (MACOSX_DEPLOYMENT_TARGET below).
#
# A workflow run by hand can only be started once it is on the default branch: until this file is
# merged, a branch can prove it only with a push trigger of its own, removed again after one run.
#
# Each job uses runners from the account's shared limit (20 jobs at a time); one run is two jobs.
on:
  # TEMPORARY: one proving run on this branch only, removed in the next commit.
  push:
    branches: [claude/linux-mac-pkgci]
  workflow_dispatch:
    inputs:
      version:
        description: Package version (BUILD.txt), for example 2026-11-16.1
        required: true
        default: test
      release:
        description: A release package (HEAD on main, notices and licences complete); else a test build
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: preview-packages-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
jobs:
  package:
    name: package (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux-x86_64
            runner: ubuntu-22.04
            jobs: 4
          - system: macos-arm64
            runner: macos-15
            # Apple silicon runners have 7 GB of memory: two compilers at a time.
            jobs: 2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      # macOS: the oldest system the program is built for (Rust's own default for arm64), whatever
      # the runner's SDK; ignored on Linux.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A release package checks that HEAD is on origin's main.
          fetch-depth: 0
      - name: Install the pinned Rust tools (rust-toolchain.toml)
        run: rustup toolchain install
      # What the program's crates need to build on Linux, kept in step with the Linux pieces as they
      # come: pkg-config and ALSA's and D-Bus's headers for the sound output (cpal and its
      # real-time thread priority). The window (winit) and Vulkan load their libraries at run time.
      - name: Install the Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libdbus-1-dev
      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ inputs.version || 'ci-test' }}
          RELEASE: ${{ inputs.release || false }}
        run: |
          flag=--test-build
          if [ "$RELEASE" = true ]; then flag=; fi
          sh scripts/package-playtest.sh --version "$VERSION" --system ${{ matrix.system }} --profile play $flag
          cat "dist/nv-rs-preview-${{ matrix.system }}/BUILD.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nv-rs-preview-${{ matrix.system }}
          path: |
            dist/nv-rs-preview-${{ matrix.system }}.tar.gz
            dist/nv-rs-preview-${{ matrix.system }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-linux:
    name: check (Linux)
    runs-on: ubuntu-latest
    env:
      # Same as the Windows job: one build from the cache, no incremental state or debug info.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native viewer dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # One compiler process for engine-fallout's tests needs more than the runner's 16 GB of
      # memory (more than 18 GB measured on Linux); Windows runners page to their page file.
      - name: Add swap for the engine's test build
        run: |
          sudo swapoff -a
          sudo fallocate -l 16G /mnt/ci.swap
          sudo chmod 600 /mnt/ci.swap
          sudo mkswap /mnt/ci.swap
          sudo swapon /mnt/ci.swap
          free -h
      - name: Install stable Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            viewer -> target
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Linux viewer
        working-directory: viewer
        run: cargo check --locked
      - name: Check the Linux acceptance script
        run: shellcheck scripts/acceptance.sh
      - name: Check core formatting, tests and lints
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
  check:
    name: check (${{ matrix.workspace }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [core, viewer]
    env:
      # CI builds once from a cache; incremental state and debug info only cost time.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install stable Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Reuse compiled dependencies between runs. Only pushes to main save the
      # cache, so pull requests restore main's build without filling the store.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.workspace == 'viewer' && 'viewer -> target' || '. -> target' }}
          shared-key: ${{ matrix.workspace }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting, tests and lints
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          if ($env:WORKSPACE -eq 'viewer') { Set-Location viewer }
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  # On pushes to main only (2026-10-30): on pull requests the hosted macOS runners often never
  # picked the job up, and GitHub cancelled it after 15 minutes without a single step, which
  # marked the pull request failed. The Windows and Linux checks gate pull requests.
  check-macos-viewer:
    name: check viewer (macOS)
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check the macOS viewer
        run: cargo check --locked --manifest-path viewer/Cargo.toml

[package]
name = "launcher"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "The preview package's Play.exe: finds the player's game, makes this PC's tables, keeps every file the game writes in the package's own folder, starts the game and says plainly what went wrong. Windows only."

[[bin]]
name = "Play"
path = "src/main.rs"

# Standalone tool, not part of the root workspace. Its dependencies are the project's own:
# game-profile (the profile files' sections and settings lines, shared with the host's first start
# on Linux and macOS) and mod-install (the mods folders, shared with play.sh's --mods).
[dependencies]
game-profile = { path = "../../crates/game-profile" }
mod-install = { path = "../../crates/mod-install" }

[workspace]

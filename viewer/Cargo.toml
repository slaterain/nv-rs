[package]
name = "nv-viewer"
version = "0.1.0"
description = "Runs Fallout: New Vegas through the engine port: the game's own translated code on the player's FalloutNV.exe"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The game's own translated code (crates/engine), started on the player's FalloutNV.exe.
host = { path = "../crates/host" }

# Linux and macOS: `--find`, the game and saves folders `play.sh` offers.
[target.'cfg(not(windows))'.dependencies]
game-folders = { path = "../crates/game-folders" }
# play.sh --mods: the game folder for mods, made as Play.exe makes it on Windows.
mod-install = { path = "../crates/mod-install" }
# The mods profile's plugin list where the game reads it (machine_table::plugins_txt).
engine-platform = { path = "../crates/engine-platform" }

[package]
name = "engine-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The platform layer of the engine (ADR-0006): the window, Direct3D 9 and D3DX, DirectInput, DirectSound, DirectShow, Bink, Ogg Vorbis, mmio, files, the loader and the process, joined to engine-core's kernel through its Layer; only the engine facade and the host depend on it"

[dependencies]
engine-core = { path = "../engine-core" }
# The Bink layer (bink.rs) decodes with the repository's own Bink 1 decoder.
bink = { path = "../bink" }
mp3 = { path = "../mp3" }
# The Direct3D 9 call stream between the model and the real device (d3d9backend.rs; the render thread).
d3d9-stream = { path = "../d3d9-stream" }
vorbis = { path = "../vorbis" }
# The textures D3DX makes (d3dx.rs), translated: byte for byte the 32-bit d3dx9_38.dll, no DLL.
d3dx-tex = { path = "../d3dx-tex" }
# The Direct3D 9 calls on wgpu instead, or beside the real d3d9.dll for comparison (NV_D3D9=wgpu,
# NV_D3D9=real,wgpu; d3d9real.rs): a backend of the same stream. On every system: the formats it
# makes (d3dx.rs) and its start screen's output (lib.rs) are asked about outside d3d9real.rs, and
# wgpu (Vulkan, Metal) is what Linux and macOS will draw with.
d3d9-wgpu = { path = "../d3d9-wgpu" }

# The Direct3D 9 layer forwarded to the real d3d9.dll with NV_D3D9=real (ADR-0008, d3d9real.rs):
# the real window, device and resources. Win32_System_SystemInformation: the machine's memory
# for GlobalMemoryStatus(Ex) (process.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D9", "Win32_Graphics_Gdi", "Foundation_Numerics", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging"] }

# Sound on the speakers off Windows (sound_out.rs, `mod device`): the default output device through
# ALSA (PipeWire's and PulseAudio's ALSA plugins among them) on Linux, CoreAudio on macOS. The
# mixer is the port's own on every system; only the device differs. No cpal features: its
# `realtime` would do nothing on Linux as built (no D-Bus/rtkit) and is not used on macOS.
# Thread priority: on Linux the device's thread makes one attempt at SCHED_FIFO itself (libc,
# already in the Linux tree through cpal and alsa) and says the result; on macOS CoreAudio's IO
# thread is already real-time. Linux links ALSA's libasound.so.2 (alsa-sys): the program needs it
# to start. Windows keeps its own WASAPI arm (no cpal there).
[target.'cfg(not(windows))'.dependencies]
cpal = "0.18.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The tests of the C runtime's stdio that moved here (crt_stdio_tests.rs) and of the process side
# use the core's addresses and helpers behind this feature.
[dev-dependencies]
engine-core = { path = "../engine-core", features = ["test-support"] }
# The built-in xNVSE's function-file walk run through this layer's file calls (files.rs tests).
nvse = { path = "../nvse" }

[package]
name = "engine-gamebryo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FalloutNV.exe translated function by function: the Gamebryo units (NiMain, NiAnimation, NiCollision, NiParticle, NiSystem, NiXenonRenderer)"

[dependencies]
engine-core = { path = "../engine-core" }

[dev-dependencies]
# `Engine::on_site_for_test` for the JIP game patch seams' tests (step 3.9).
engine-core = { path = "../engine-core", features = ["test-support"] }

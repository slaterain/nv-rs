[package]
name = "ds-mix"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "What DirectSound does with the game's sound buffers, as measured on the player's machine: the mixer, the two sample-rate converters, speaker placement, the 3D stage, the distortion effect, and the output to the default device; used by the engine's platform layer and by programs without the engine (the launcher)"

[dependencies]
# The sound output's thread is not background work for Windows (sound_out.rs).
qos = { path = "../qos" }

# Sound on the speakers off Windows (sound_out.rs, `mod device`): the default output device through
# ALSA (PipeWire's and PulseAudio's ALSA plugins among them) on Linux, CoreAudio on macOS. The
# mixer is the port's own on every system; only the device differs. No cpal features: its
# `realtime` would do nothing on Linux as built (no D-Bus/rtkit) and is not used on macOS; the
# Linux sound thread runs at normal priority (sound_out.rs says why). Linux links ALSA's
# libasound.so.2 (alsa-sys): the program needs it to start. Windows keeps its own WASAPI arm
# (no cpal there).
[target.'cfg(not(windows))'.dependencies]
cpal = "0.18.2"

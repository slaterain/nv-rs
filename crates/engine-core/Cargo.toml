[package]
name = "engine-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The core of the engine crates: the game's memory model, Engine, the exe mapping, the static tables, the CRT units and the core of the platform layer (ADR-0006)"

[features]
# Test support that other engine crates' unit tests use (the form-constructor
# checker `units::crt::ctor_test`, and for `engine-platform` the addresses and helpers of
# `units::crt::stdio::test_support` and `units::platform::test_support`); they enable it as a
# dev-dependency.
test-support = []
# The x87 extended-register helpers in software (x87/soft.rs) on an x86-64 host too, so that this
# PC's tests run the path Apple silicon and ARM Linux use and compare it with the FPU. Tests only.
soft-x87 = []

# The threads it starts tell Windows they are not background work when NV_NOT_BACKGROUND=1 (crates/qos).
[dependencies]
qos = { path = "../qos" }

# Win32_System_Memory: the guest memory's 4 GB host reservation (mem.rs, VirtualAlloc and
# VirtualFree). Win32_System_Threading: the game threads' processor time (thread_cpu.rs).
# The platform layer's Windows APIs are the `engine-platform` crate's.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(nv_chained_unwind_asm)"] }

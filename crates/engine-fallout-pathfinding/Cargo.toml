[package]
name = "engine-fallout-pathfinding"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FalloutNV.exe translated function by function: fallout shared/Pathfinding"

[dependencies]
engine-core = { path = "../engine-core" }
engine-gamebryo = { path = "../engine-gamebryo" }
engine-bs = { path = "../engine-bs" }
engine-havok = { path = "../engine-havok" }
engine-speedtree = { path = "../engine-speedtree" }

[dev-dependencies]
# The form-constructor checker of units::crt (ctor_test) for this crate's tests.
engine-core = { path = "../engine-core", features = ["test-support"] }
# Phase A of the split by area (docs/ENGINE_CRATE.md, "The fallout crates"): every other
# fallout crate, so this crate's tests register every translated function as before the
# split. Phase B removes the ones no test needs.
engine-fallout = { path = "../engine-fallout" }
engine-fallout-facegen = { path = "../engine-fallout-facegen" }
engine-fallout-script = { path = "../engine-fallout-script" }
engine-fallout-env = { path = "../engine-fallout-env" }

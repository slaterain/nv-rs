[package]
name = "nvse"
version = "0.1.0"
description = "xNVSE (the New Vegas Script Extender) built in: its script commands and what they run on (ADR-0016)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
engine-core = { path = "../engine-core" }

[dev-dependencies]
# The opt-in test of the decompiler on the player's FalloutNV.esm scripts.
esm = { path = "../esm" }

[features]
# For other crates' tests: commands' argument reads checked against what the reader stored
# (`Read`'s accessors panic on a read that cannot receive it), and the lambda test helpers.
test-support = []

[package]
name = "jip"
version = "0.1.0"
description = "JIP LN NVSE (xNVSE's largest plugin) built in: its command table, identity and, step by step, its commands (ADR-0016)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
engine-core = { path = "../engine-core" }
nvse = { path = "../nvse" }
# The built-in UI Organizer, which InjectUIComponent calls (JIP calls UIO's export).
uio = { path = "../uio" }

[dev-dependencies]
# Every command test checks that each argument is read as its parameter type stores it; lambda helpers.
nvse = { path = "../nvse", features = ["test-support"] }
# A second engine sharing a test engine's slots (the lock-free reads' tests).
engine-core = { path = "../engine-core", features = ["test-support"] }

[features]
# For the engine crates' tests: `test_support` (xNVSE's table and JIP put into a test's engine, a
# command called through its record), with xNVSE's checked argument reads.
test-support = ["nvse/test-support"]
